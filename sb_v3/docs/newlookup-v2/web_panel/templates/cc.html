<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC - NewLookup Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa}
        .admin-header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
        .admin-header-top{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;max-width:1600px;margin:0 auto}
        .admin-header h1{font-size:22px;font-weight:600}
        .admin-header-actions{display:flex;align-items:center;gap:12px}
        .admin-btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;border:none}
        .admin-btn-outline{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}
        .admin-btn-outline:hover{background:rgba(255,255,255,.3)}
        .admin-nav{background:rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.15)}
        .admin-nav-inner{display:grid;grid-template-columns:repeat(10,1fr);gap:0;max-width:1600px;margin:0 auto}
        .admin-nav-item{display:flex;align-items:center;justify-content:center;padding:14px 12px;color:rgba(255,255,255,.9);text-decoration:none;font-size:13px;font-weight:500;border-bottom:3px solid transparent}
        .admin-nav-item:hover{background:rgba(255,255,255,.15)}
        .admin-nav-item.active{background:rgba(255,255,255,.25);border-bottom-color:#fff}
        .container{max-width:1600px;margin:0 auto;padding:24px 32px}
        .tabs{background:#fff;border-bottom:2px solid #e5e7eb;display:flex}
        .tab-btn{padding:14px 20px;border:none;background:0 0;cursor:pointer;font-size:14px;font-weight:500;color:#6b7280;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
        .tab-btn:hover{color:#667eea}
        .tab-btn.active{color:#667eea;border-bottom-color:#667eea}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .section{background:#fff;padding:24px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:20px}
        .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .section h2{font-size:18px;font-weight:600}
        .btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
        .btn-primary{background:#667eea;color:#fff}
        .btn-primary:hover{background:#5a67d8}
        .btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
        .btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
        .btn-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
        .btn-sm{padding:5px 10px;font-size:12px}
        table{width:100%;border-collapse:collapse;font-size:14px}
        th{background:#f9fafb;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase}
        td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
        tr:hover td{background:#fafbff}
        .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
        .badge-pending{background:#fef3c7;color:#92400e}
        .badge-approved{background:#d1fae5;color:#065f46}
        .badge-rejected{background:#fee2e2;color:#991b1b}
        .badge-active{background:#d1fae5;color:#065f46}
        .badge-inactive{background:#f3f4f6;color:#6b7280}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;padding:20px;overflow-y:auto}
        .modal.open{display:flex;align-items:flex-start;justify-content:center}
        .modal-box{background:#fff;border-radius:12px;width:100%;max-width:520px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
        .modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #e5e7eb}
        .modal-head h3{font-size:17px;font-weight:600}
        .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280}
        .modal-body{padding:24px}
        .modal-foot{padding:16px 24px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
        @media(max-width:768px){.container{padding:16px}}
    </style>
</head>
<body>
<header class="admin-header">
    <div class="admin-header-top">
        <h1>💳 CC</h1>
        <div class="admin-header-actions">
            <span id="adminName">Admin</span>
            <a href="/dashboard" class="admin-btn admin-btn-outline">← Dashboard</a>
            <button class="admin-btn admin-btn-outline" onclick="logout()">🚪 Выход</button>
        </div>
    </div>
    {% include '_nav.html' %}
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab('catalog', this)">📦 Каталог</button>
    <button class="tab-btn" onclick="showTab('moderation', this)">⏳ На модерации</button>
    <button class="tab-btn" onclick="showTab('categories', this)">🗂️ Категории</button>
</div>

<div class="container">
    <!-- Catalog -->
    <div class="tab-content active" id="tab-catalog">
        <div class="section">
            <div class="section-head">
                <h2>📦 CC Каталог</h2>
                <button class="btn btn-primary btn-sm" onclick="openItemModal(null)">+ Добавить позицию</button>
            </div>
            <div id="catalog-list"><div style="text-align:center;padding:40px;color:#888">Загрузка...</div></div>
        </div>
    </div>

    <!-- Moderation -->
    <div class="tab-content" id="tab-moderation">
        <div class="section">
            <div class="section-head">
                <h2>⏳ На модерации (Seller CC Items)</h2>
                <button class="btn btn-secondary btn-sm" onclick="loadModeration()">🔄 Обновить</button>
            </div>
            <div class="controls" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
                <select id="modStatusFilter" onchange="loadModeration()">
                    <option value="pending_moderation">Ожидает</option>
                    <option value="">Все</option>
                    <option value="approved">Одобрены</option>
                    <option value="rejected">Отклонены</option>
                </select>
                <input id="modSearchQ" type="text" placeholder="BIN / Банк / Бренд" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;width:200px" onkeydown="if(event.key==='Enter')loadModeration()">
                <select id="modCardType" onchange="loadModeration()">
                    <option value="">Тип карты</option>
                    <option value="CREDIT">Credit</option>
                    <option value="DEBIT">Debit</option>
                    <option value="PREPAID">Prepaid</option>
                </select>
                <select id="modCardBrand" onchange="loadModeration()">
                    <option value="">Бренд</option>
                    <option value="Visa">Visa</option>
                    <option value="Mastercard">Mastercard</option>
                    <option value="Amex">Amex</option>
                    <option value="Discover">Discover</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="clearModFilters()">✖ Сброс</button>
            </div>
            <div id="moderation-list"><div style="text-align:center;padding:40px;color:#888">Загрузка...</div></div>
        </div>
    </div>

    <!-- Categories -->
    <div class="tab-content" id="tab-categories">
        <div class="section">
            <div class="section-head">
                <h2>🗂️ Категории CC</h2>
                <button class="btn btn-primary btn-sm" onclick="openCatModal(null)">+ Добавить</button>
            </div>
            <div id="cc-cats-list"><div style="text-align:center;padding:40px;color:#888">Загрузка...</div></div>
        </div>
    </div>
</div>

<!-- CC Item Modal -->
<div class="modal" id="itemModal">
    <div class="modal-box">
        <div class="modal-head"><h3 id="itemModalTitle">CC Позиция</h3><button class="modal-close" onclick="closeModal('itemModal')">×</button></div>
        <div class="modal-body">
            <input type="hidden" id="itemId">
            <div class="form-group"><label>Код (уникальный)</label><input id="itemCode" placeholder="visa_classic"></div>
            <div class="form-group"><label>Название</label><input id="itemName" placeholder="Visa Classic"></div>
            <div class="form-group"><label>Категория</label><select id="itemCat"></select></div>
            <div class="form-group"><label>Цена ($)</label><input type="number" id="itemPrice" step="0.01" min="0"></div>
            <div class="form-group"><label>Описание</label><textarea id="itemDesc" rows="3" style="resize:vertical"></textarea></div>
            <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="itemActive" checked> Активна</label></div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('itemModal')">Отмена</button>
            <button class="btn btn-primary" onclick="saveItem()">💾 Сохранить</button>
        </div>
    </div>
</div>

<!-- Category Modal -->
<div class="modal" id="catModal">
    <div class="modal-box">
        <div class="modal-head"><h3 id="catModalTitle">Категория CC</h3><button class="modal-close" onclick="closeModal('catModal')">×</button></div>
        <div class="modal-body">
            <input type="hidden" id="catId">
            <div class="form-group"><label>Код</label><input id="catCode" placeholder="visa"></div>
            <div class="form-group"><label>Название</label><input id="catName" placeholder="VISA"></div>
            <div class="form-group"><label>Позиция</label><input type="number" id="catPos" value="0" min="0"></div>
            <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="catActive" checked> Активна</label></div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('catModal')">Отмена</button>
            <button class="btn btn-primary" onclick="saveCat()">💾 Сохранить</button>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/';
async function authFetch(url, o = {}) {
    if (!o.headers) o.headers = {};
    o.headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(url, o);
    if (r.status === 401) { localStorage.removeItem('token'); window.location.href = '/'; return null; }
    return r;
}
function logout() { localStorage.removeItem('token'); window.location.href = '/'; }

let ccCategories = [];

function showTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    if (btn) btn.classList.add('active');
    if (name === 'catalog') loadCatalog();
    else if (name === 'moderation') loadModeration();
    else if (name === 'categories') loadCategories();
}

async function loadCatalog() {
    const el = document.getElementById('catalog-list');
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Загрузка...</div>';
    try {
        const r = await authFetch('/api/cc-catalog/items');
        if (!r) return;
        const items = await r.json();
        if (!items.length) { el.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Нет позиций</div>'; return; }
        const rows = items.map(i => `<tr>
            <td>${i.id}</td><td><b>${i.name}</b></td>
            <td><span style="background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:20px;font-size:11px">${i.category_code}</span></td>
            <td>$${parseFloat(i.price||0).toFixed(2)}</td>
            <td><span class="${i.is_active ? 'badge-active' : 'badge-inactive'} badge">${i.is_active ? 'Активна' : 'Выкл'}</span></td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick='openItemModal(${JSON.stringify(i)})'>✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem(${i.id})">🗑️</button>
            </td>
        </tr>`).join('');
        el.innerHTML = `<table><thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody>${rows}</tbody></table>`;
    } catch (e) {
        el.innerHTML = `<div style="color:red;padding:20px">Ошибка: ${e.message}</div>`;
    }
}

function clearModFilters() {
    document.getElementById('modSearchQ').value = '';
    document.getElementById('modCardType').value = '';
    document.getElementById('modCardBrand').value = '';
    document.getElementById('modStatusFilter').value = 'pending_moderation';
    loadModeration();
}

async function loadModeration() {
    const el = document.getElementById('moderation-list');
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Загрузка...</div>';
    const status = document.getElementById('modStatusFilter').value;
    const q = (document.getElementById('modSearchQ').value || '').trim();
    const cardType = document.getElementById('modCardType').value;
    const cardBrand = document.getElementById('modCardBrand').value;
    try {
        const params = new URLSearchParams();
        if (status) params.set('status', status);
        if (q) params.set('q', q);
        if (cardType) params.set('card_type', cardType);
        if (cardBrand) params.set('card_brand', cardBrand);
        const qs = params.toString();
        const url = '/api/seller-moderation/cc-items' + (qs ? '?' + qs : '');
        const r = await authFetch(url);
        if (!r) return;
        const items = await r.json();
        if (!items.length) { el.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Нет позиций</div>'; return; }
        const BADGES = { pending_moderation: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' };
        const rows = items.map(i => `<tr>
            <td>${i.id}</td><td><b>${i.item_name}</b></td>
            <td>${i.category_code}</td>
            <td>${i.seller_name || i.seller_id || '—'}</td>
            <td>$${parseFloat(i.seller_price||0).toFixed(2)} → $${parseFloat(i.buyer_price||0).toFixed(2)}</td>
            <td><span class="badge ${BADGES[i.moderation_status]||'badge-pending'}">${i.moderation_status}</span></td>
            <td>
                ${i.moderation_status === 'pending_moderation' ? `
                    <button class="btn btn-success btn-sm" onclick="moderateItem(${i.id}, 'approve')">✅ Одобрить</button>
                    <button class="btn btn-danger btn-sm" onclick="moderateItem(${i.id}, 'reject')">❌ Отклонить</button>
                ` : '—'}
            </td>
        </tr>`).join('');
        el.innerHTML = `<table><thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Seller</th>
            <th>Цена</th><th>Статус</th><th>Действия</th></tr></thead><tbody>${rows}</tbody></table>`;
    } catch (e) {
        el.innerHTML = `<div style="color:red;padding:20px">Ошибка: ${e.message}</div>`;
    }
}

async function moderateItem(id, action) {
    const r = await authFetch(`/api/seller-moderation/cc-items/${id}/${action}`, { method: 'POST' });
    if (r && r.ok) loadModeration();
    else { const e = await r?.json(); alert('Ошибка: ' + (e?.detail || 'unknown')); }
}

async function loadCategories() {
    const el = document.getElementById('cc-cats-list');
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Загрузка...</div>';
    try {
        const r = await authFetch('/api/cc-catalog/categories');
        if (!r) return;
        ccCategories = await r.json();
        const rows = ccCategories.map(c => `<tr>
            <td>${c.id}</td><td><b>${c.name}</b></td><td><code>${c.code}</code></td>
            <td>${c.position}</td>
            <td><span class="badge ${c.is_active ? 'badge-active' : 'badge-inactive'}">${c.is_active ? 'Активна' : 'Выкл'}</span></td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick='openCatModal(${JSON.stringify(c)})'>✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCat(${c.id})">🗑️</button>
            </td>
        </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;padding:20px;color:#888">Нет категорий</td></tr>';
        el.innerHTML = `<table><thead><tr><th>ID</th><th>Название</th><th>Код</th><th>Позиция</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody>${rows}</tbody></table>`;
    } catch (e) {
        el.innerHTML = `<div style="color:red;padding:20px">Ошибка: ${e.message}</div>`;
    }
}

async function openItemModal(item) {
    // Ensure categories loaded
    if (!ccCategories.length) {
        const r = await authFetch('/api/cc-catalog/categories');
        if (r) ccCategories = await r.json();
    }
    document.getElementById('itemModalTitle').textContent = item ? 'Редактировать позицию' : 'Новая CC позиция';
    document.getElementById('itemId').value = item ? item.id : '';
    document.getElementById('itemCode').value = item ? item.cc_code : '';
    document.getElementById('itemCode').disabled = !!item;
    document.getElementById('itemName').value = item ? item.name : '';
    document.getElementById('itemPrice').value = item ? parseFloat(item.price) : '';
    document.getElementById('itemDesc').value = item ? (item.description || '') : '';
    document.getElementById('itemActive').checked = item ? item.is_active : true;
    const sel = document.getElementById('itemCat');
    sel.innerHTML = '';
    ccCategories.forEach(c => {
        const o = document.createElement('option');
        o.value = c.code; o.textContent = c.name;
        if (item && item.category_code === c.code) o.selected = true;
        sel.appendChild(o);
    });
    document.getElementById('itemModal').classList.add('open');
}

async function saveItem() {
    const id = document.getElementById('itemId').value;
    const body = {
        name: document.getElementById('itemName').value,
        category_code: document.getElementById('itemCat').value,
        price: parseFloat(document.getElementById('itemPrice').value),
        description: document.getElementById('itemDesc').value || null,
        is_active: document.getElementById('itemActive').checked,
    };
    if (!id) body.cc_code = document.getElementById('itemCode').value;
    const url = id ? `/api/cc-catalog/items/${id}` : '/api/cc-catalog/items';
    const method = id ? 'PUT' : 'POST';
    const r = await authFetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (r && r.ok) { closeModal('itemModal'); loadCatalog(); }
    else { const e = await r?.json(); alert('Ошибка: ' + (e?.detail || 'unknown')); }
}

async function deleteItem(id) {
    if (!confirm('Удалить позицию?')) return;
    const r = await authFetch(`/api/cc-catalog/items/${id}`, { method: 'DELETE' });
    if (r && r.ok) loadCatalog();
}

function openCatModal(cat) {
    document.getElementById('catModalTitle').textContent = cat ? 'Редактировать категорию' : 'Новая категория';
    document.getElementById('catId').value = cat ? cat.id : '';
    document.getElementById('catCode').value = cat ? cat.code : '';
    document.getElementById('catCode').disabled = !!cat;
    document.getElementById('catName').value = cat ? cat.name : '';
    document.getElementById('catPos').value = cat ? cat.position : 0;
    document.getElementById('catActive').checked = cat ? cat.is_active : true;
    document.getElementById('catModal').classList.add('open');
}

async function saveCat() {
    const id = document.getElementById('catId').value;
    const body = { name: document.getElementById('catName').value, position: parseInt(document.getElementById('catPos').value), is_active: document.getElementById('catActive').checked };
    if (!id) body.code = document.getElementById('catCode').value;
    const url = id ? `/api/cc-catalog/categories/${id}` : '/api/cc-catalog/categories';
    const r = await authFetch(url, { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (r && r.ok) { closeModal('catModal'); loadCategories(); }
    else { const e = await r?.json(); alert('Ошибка: ' + (e?.detail || 'unknown')); }
}

async function deleteCat(id) {
    if (!confirm('Удалить категорию?')) return;
    const r = await authFetch(`/api/cc-catalog/categories/${id}`, { method: 'DELETE' });
    if (r && r.ok) loadCategories();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Init
loadCatalog();
</script>
</body>
</html>
