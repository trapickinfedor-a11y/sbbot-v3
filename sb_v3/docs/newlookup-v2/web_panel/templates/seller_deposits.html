{% extends "_base.html" %}
{% block title %}Seller Deposits{% endblock %}
{% block header_title %}💳 Seller Deposit Payments{% endblock %}
{% block extra_css %}
<style>
.section{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select,.filters button{padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.payments-table{width:100%;border-collapse:collapse}
.payments-table th,.payments-table td{padding:12px 14px;text-align:left;border-bottom:1px solid #e5e7eb;vertical-align:top}
.payments-table th{background:#f9fafb}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge-paid{background:#d1fae5;color:#065f46}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-expired,.badge-cancelled,.badge-refunded,.badge-withheld{background:#fee2e2;color:#991b1b}
.empty{padding:32px;color:#6b7280;text-align:center}
.btn{padding:8px 12px;border:none;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer}
</style>
{% endblock %}
{% block content %}
<div class="section">
    <div class="filters">
        <input id="sellerIdFilter" type="number" placeholder="Seller ID">
        <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="pending">pending</option>
            <option value="paid">paid</option>
            <option value="expired">expired</option>
            <option value="refunded">refunded</option>
            <option value="withheld">withheld</option>
            <option value="cancelled">cancelled</option>
        </select>
        <button class="btn" onclick="loadPayments()">Apply</button>
    </div>
    <div id="paymentsContent"><div class="empty">Loading...</div></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function esc(v){return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(v){return v?new Date(v).toLocaleString('ru-RU'):'—'}
function badge(v){return `<span class="badge badge-${esc(v)}">${esc(v)}</span>`}
async function syncPayment(id){
  const r=await authFetch(`/api/seller-deposits/${id}/sync`,{method:'POST'});
  if(!r||!r.ok){alert('Sync failed');return}
  loadPayments();
}
async function loadPayments(){
  const params=new URLSearchParams();
  const sellerId=document.getElementById('sellerIdFilter').value.trim();
  const status=document.getElementById('statusFilter').value;
  if(sellerId) params.set('seller_id', sellerId);
  if(status) params.set('status', status);
  const r=await authFetch(`/api/seller-deposits?${params.toString()}`);
  if(!r||!r.ok){document.getElementById('paymentsContent').innerHTML='<div class="empty">Failed to load payments</div>';return}
  const list=await r.json();
  if(!list.length){document.getElementById('paymentsContent').innerHTML='<div class="empty">No payments found</div>';return}
  document.getElementById('paymentsContent').innerHTML=`<table class="payments-table"><thead><tr><th>ID</th><th>Seller</th><th>Package</th><th>Categories</th><th>Amount</th><th>Status</th><th>Created</th><th>Paid</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td>${p.id}</td><td>${esc(p.seller_name)}<br><small>#${p.seller_id}</small></td><td>${esc(p.package_label)}<br><small>${esc(p.package_code)}</small></td><td>${esc((p.categories||[]).join(', ')||'—')}</td><td>${esc(p.amount)} ${esc(p.currency)}</td><td>${badge(p.status)}</td><td>${fmt(p.created_at)}</td><td>${fmt(p.paid_at)}</td><td><button class="btn" onclick="syncPayment(${p.id})">Sync</button></td></tr>`).join('')}</tbody></table>`;
}
loadPayments();
</script>
{% endblock %}
