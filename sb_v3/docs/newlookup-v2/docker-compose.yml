# Варианты запуска (см. docs/LAUNCH_RUNBOOK.md):
#   docker compose up -d                           → полный стек
#   docker compose up postgres redis main_bot -d   → MVP
#   docker compose up postgres redis main_bot support_bot web_panel -d  → без seller_bot

services:
  # ========== PostgreSQL Database ==========
  postgres:
    image: postgres:16-alpine
    container_name: newlookup_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newlookup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-newlookup}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Expose to host only in dev; in production comment out or use 127.0.0.1
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newlookup} -d ${POSTGRES_DB:-newlookup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Redis Cache ==========
  redis:
    image: redis:7-alpine
    container_name: newlookup_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ========== Main Bot ==========
  main_bot:
    build:
      context: .
      dockerfile: main_bot/Dockerfile
    container_name: newlookup_main_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MAIN_BOT_TOKEN=${MAIN_BOT_TOKEN}
      - MAIN_BOT_USERNAME=${MAIN_BOT_USERNAME}
      - SUPPORT_BOT_TOKEN=${SUPPORT_BOT_TOKEN}
      - ORDERS_CHANNEL_ID=${ORDERS_CHANNEL_ID}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - WEB_PANEL_SECRET_KEY=${WEB_PANEL_SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./uploads:/app/uploads
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Support Bot ==========
  support_bot:
    build:
      context: .
      dockerfile: support_bot/Dockerfile
    container_name: newlookup_support_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TASKS_DATABASE_URL=${TASKS_DATABASE_URL:-sqlite+aiosqlite:////app/data/tasks.db}
      - SUPPORT_BOT_TOKEN=${SUPPORT_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - WEB_PANEL_SECRET_KEY=${WEB_PANEL_SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Worker Bot ==========
  worker_bot:
    build:
      context: .
      dockerfile: worker_bot/Dockerfile
    container_name: newlookup_worker_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TASKS_DATABASE_URL=${TASKS_DATABASE_URL:-sqlite+aiosqlite:////app/data/tasks.db}
      - WORKER_BOT_TOKEN=${WORKER_BOT_TOKEN}
      - ORDERS_CHANNEL_ID=${ORDERS_CHANNEL_ID}
      - ADMIN_IDS=${ADMIN_IDS}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - WEB_PANEL_SECRET_KEY=${WEB_PANEL_SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
    # Internal API — no host exposure needed; other services reach it via bot_network
    expose:
      - "8181"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Web Panel (Admin) ==========
  web_panel:
    build:
      context: .
      dockerfile: web_panel/Dockerfile
    container_name: newlookup_web_panel
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TASKS_DATABASE_URL=${TASKS_DATABASE_URL:-sqlite+aiosqlite:////app/data/tasks.db}
      - WEB_PANEL_SECRET_KEY=${WEB_PANEL_SECRET_KEY}
      - WEB_PANEL_PORT=${WEB_PANEL_PORT:-8000}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIN_BOT_TOKEN=${MAIN_BOT_TOKEN}
      - SUPPORT_BOT_TOKEN=${SUPPORT_BOT_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - REDIS_URL=${REDIS_URL}
    ports:
      - "${WEB_PANEL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Lookup API (self-hosted SSN/DL search) ==========
  lookup_api:
    build:
      context: ./lookup_api
      dockerfile: Dockerfile
    container_name: newlookup_lookup_api
    env_file:
      - .env
    environment:
      - LOOKUP_DB_PATH=/app/data/lookup.db
      - LOOKUP_API_PORT=${LOOKUP_API_PORT:-8082}
      - LOOKUP_ADMIN_TOKEN=${LOOKUP_ADMIN_TOKEN:?Set LOOKUP_ADMIN_TOKEN in .env}
      - PRICE_SSN_FOUND=${PRICE_SSN_FOUND:-0.40}
      - PRICE_SSN_NOFOUND=${PRICE_SSN_NOFOUND:-0.01}
      - PRICE_DL_FOUND=${PRICE_DL_FOUND:-1.00}
      - PRICE_DL_NOFOUND=${PRICE_DL_NOFOUND:-0.00}
    # Internal only — bots reach it via bot_network; no host exposure
    expose:
      - "8082"
    volumes:
      - ./data:/app/data
    networks:
      - bot_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Celery Worker ==========
  celery_worker:
    build:
      context: .
      dockerfile: main_bot/Dockerfile
    container_name: newlookup_celery_worker
    command: celery -A shared.tasks.auto_complete:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - CELERY_AUTO_COMPLETE_INTERVAL_MINUTES=${CELERY_AUTO_COMPLETE_INTERVAL_MINUTES:-5}
      - CELERY_VIOLATION_CHECK_INTERVAL_MINUTES=${CELERY_VIOLATION_CHECK_INTERVAL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Celery Beat ==========
  celery_beat:
    build:
      context: .
      dockerfile: main_bot/Dockerfile
    container_name: newlookup_celery_beat
    command: celery -A shared.tasks.auto_complete:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - CELERY_AUTO_COMPLETE_INTERVAL_MINUTES=${CELERY_AUTO_COMPLETE_INTERVAL_MINUTES:-5}
      - CELERY_VIOLATION_CHECK_INTERVAL_MINUTES=${CELERY_VIOLATION_CHECK_INTERVAL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Marketer Bot ==========
  marketer_bot:
    build:
      context: .
      dockerfile: marketer_bot/Dockerfile
    container_name: newlookup_marketer_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MARKETER_BOT_TOKEN=${MARKETER_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - SUPPORT_BOT_TOKEN=${SUPPORT_BOT_TOKEN}
      - REDIS_URL=${REDIS_URL}
      - MAIN_BOT_API_URL_INTERNAL=http://main_bot:8080
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main_bot:
        condition: service_started
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Seller Bot ==========
  seller_bot:
    build:
      context: .
      dockerfile: seller_bot/Dockerfile
    container_name: newlookup_seller_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TASKS_DATABASE_URL=${TASKS_DATABASE_URL:-sqlite+aiosqlite:////app/data/tasks.db}
      - SELLER_BOT_TOKEN=${SELLER_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - SUPPORT_BOT_TOKEN=${SUPPORT_BOT_TOKEN}
      - SELLER_MINI_APP_URL=${SELLER_MINI_APP_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    networks:
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bot_network:
    driver: bridge
