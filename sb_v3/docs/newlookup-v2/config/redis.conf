# Redis Configuration for NewLookup
# Optimized for caching and session storage

# ========== NETWORK ==========
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ========== GENERAL ==========
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ========== SNAPSHOTTING ==========
# Disable RDB persistence for cache-only usage
# Uncomment if you need persistence
# save 900 1
# save 300 10
# save 60 10000
save ""

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ========== REPLICATION ==========
# Uncomment for replica configuration
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# ========== SECURITY ==========
# Password protection (set via environment variable)
# requirepass your_redis_password

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# ========== MEMORY MANAGEMENT ==========
# Maximum memory: 2GB for 32GB RAM server
maxmemory 2gb

# Eviction policy: Remove least recently used keys
maxmemory-policy allkeys-lru

# LRU samples
maxmemory-samples 5

# ========== LAZY FREEING ==========
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ========== APPEND ONLY FILE ==========
# Disable AOF for cache-only usage
appendonly no

# Uncomment if you need AOF persistence
# appendonly yes
# appendfilename "appendonly.aof"
# appendfsync everysec
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# ========== LUA SCRIPTING ==========
lua-time-limit 5000

# ========== SLOW LOG ==========
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========== LATENCY MONITOR ==========
latency-monitor-threshold 100

# ========== EVENT NOTIFICATION ==========
notify-keyspace-events ""

# ========== ADVANCED CONFIG ==========
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# ========== ACTIVE REHASHING ==========
activerehashing yes

# ========== CLIENT OUTPUT BUFFER LIMITS ==========
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ========== FREQUENCY ==========
hz 10
dynamic-hz yes

# ========== AOF REWRITE ==========
aof-rewrite-incremental-fsync yes

# ========== RDB SAVE ==========
rdb-save-incremental-fsync yes

# ========== CLIENTS ==========
maxclients 10000
