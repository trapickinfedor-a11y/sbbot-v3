# PostgreSQL Configuration for NewLookup
# Optimized for 700 bots and 30K users
# Server: 16 vCPU / 32 GB RAM / NVMe SSD

# ========== CONNECTIONS ==========
max_connections = 1000
superuser_reserved_connections = 3

# ========== MEMORY ==========
# shared_buffers: 25% of RAM for dedicated DB server, 8GB for 32GB RAM
shared_buffers = 8GB

# effective_cache_size: 75% of RAM (OS + PostgreSQL cache)
effective_cache_size = 24GB

# maintenance_work_mem: For VACUUM, CREATE INDEX
maintenance_work_mem = 2GB

# work_mem: Per operation (sort, hash join)
# 16MB × 100 connections = 1.6GB max
work_mem = 16MB

# ========== WRITE AHEAD LOG (WAL) ==========
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# ========== CHECKPOINTS ==========
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ========== QUERY PLANNER ==========
# For SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200

# Statistics
default_statistics_target = 100

# ========== LOGGING ==========
# Log slow queries (>1 second)
log_min_duration_statement = 1000

# Detailed logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Log destination
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# ========== AUTOVACUUM ==========
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ========== REPLICATION (for future scaling) ==========
# Uncomment when setting up replication
# wal_level = replica
# max_wal_senders = 3
# wal_keep_size = 1GB
# hot_standby = on

# ========== PERFORMANCE ==========
# Parallel query execution
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ========== LOCALE ==========
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ========== TIMEZONE ==========
timezone = 'UTC'

# ========== SECURITY ==========
# SSL (uncomment in production)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# ========== EXTENSIONS ==========
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements configuration
pg_stat_statements.max = 10000
pg_stat_statements.track = all
