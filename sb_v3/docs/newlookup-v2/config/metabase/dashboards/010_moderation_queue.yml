        LIMIT 50

    - name: "📝 Pending Logs"
      type: "table"
      position: { row: 6, col: 1, size: 12 }
      query: |
        SELECT 
          id,
          seller_id,
          shop_name,
          price,
          stock_quantity,
          created_at,
          'Approve/Reject' as action
        FROM seller_logs_items
        WHERE moderation_status = 'pending'
        ORDER BY created_at DESC
        LIMIT 50

    - name: "📱 Pending NFC"
      type: "table"
      position: { row: 7, col: 1, size: 12 }
      query: |
        SELECT 
          id,
          seller_id,
          nfc_type,
