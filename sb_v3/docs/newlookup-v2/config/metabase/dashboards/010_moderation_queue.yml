      query: |
        SELECT 
          id,
          seller_id,
          service_type,
          seller_price,
          stock_quantity,
          created_at,
          'Approve/Reject' as action
        FROM seller_otp_items
        WHERE moderation_status = 'pending'
        ORDER BY created_at DESC
        LIMIT 50

    - name: "💳 Pending Selfreg CC"
      type: "table"
      position: { row: 9, col: 1, size: 12 }
      query: |
        SELECT 
