[databases]
newlookup = host=postgres port=5432 dbname=newlookup user=newlookup

[pgbouncer]
# Connection pooling mode
# transaction: Best for web applications (recommended)
# session: One server connection per client connection
# statement: Most aggressive, can break some applications
pool_mode = transaction

# Listen on all interfaces (Docker network)
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Administrator
admin_users = newlookup

# Connection limits
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 10
reserve_pool_size = 25
reserve_pool_timeout = 3

# Server connection limits
max_db_connections = 100
max_user_connections = 100

# Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60

# Dangerous timeouts
idle_transaction_timeout = 0

# Low-level network settings
pkt_buf = 4096
max_packet_size = 2147483647
listen_backlog = 128
sbuf_loopcnt = 5

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# Console access
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777

# DNS
dns_max_ttl = 15
dns_zone_check_period = 0

# TLS (uncomment in production)
# client_tls_sslmode = prefer
# client_tls_ca_file = /etc/ssl/certs/ca.crt
# client_tls_cert_file = /etc/ssl/certs/server.crt
# client_tls_key_file = /etc/ssl/private/server.key
