# Docker Compose for Metabase BI Stack
# Metabase + PostgreSQL (application DB) + Exporters

services:
  # ========== Metabase BI ==========
  metabase:
    image: metabase/metabase:latest
    container_name: newlookup_metabase
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=${METABASE_DB_USER:-metabase}
      - MB_DB_PASS=${METABASE_DB_PASS:-metabase_secret_password}
      - MB_DB_HOST=metabase-db
      - JAVA_TIMEZONE=UTC
      - MB_JETTY_PORT=3000
      - MB_JETTY_HOST=0.0.0.0
      - MB_NO_SSL=true
    ports:
      - "3000:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
    networks:
      - metabase-network
      - bot_network
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ========== Metabase Internal Database ==========
  metabase-db:
    image: postgres:16-alpine
    container_name: newlookup_metabase_db
    environment:
      - POSTGRES_USER=${METABASE_DB_USER:-metabase}
      - POSTGRES_PASSWORD=${METABASE_DB_PASS:-metabase_secret_password}
      - POSTGRES_DB=metabase
    volumes:
      - metabase_pgdata:/var/lib/postgresql/data
    networks:
      - metabase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_DB_USER:-metabase} -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ========== PostgreSQL Exporter for Metabase ==========
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: newlookup_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-newlookup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newlookup}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - metabase-network
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ========== Redis Exporter for Metabase ==========
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: newlookup_redis_exporter
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis}
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - metabase-network
      - bot_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ========== Node Exporter for System Metrics ==========
  node-exporter:
    image: prom/node-exporter:latest
    container_name: newlookup_node_exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - metabase-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  metabase_data:
    driver: local
  metabase_pgdata:
    driver: local

networks:
  metabase-network:
    driver: bridge
  bot_network:
    external: true
