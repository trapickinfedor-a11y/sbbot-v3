<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullz Bot Flow</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'IBM Plex Sans',sans-serif;min-height:100vh;padding:24px}
.layout{display:flex;gap:24px;max-width:1400px;margin:0 auto}
.sidebar{width:220px;flex-shrink:0}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#7d8590;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #21262d}
.flow-btn{display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:4px;background:none;border:1px solid #21262d;border-radius:6px;color:#7d8590;font-size:12px;cursor:pointer;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.flow-btn:hover{border-color:#388bfd;color:#e6edf3;background:#161b22}
.flow-btn.active{border-color:#388bfd;color:#e6edf3;background:#1c2d44;font-weight:600}
.flow-btn .num{display:inline-block;width:18px;height:18px;border-radius:50%;background:#21262d;text-align:center;line-height:18px;font-size:10px;margin-right:6px;color:#7d8590}
.flow-btn.active .num{background:#1f6feb;color:#fff}
.main{flex:1}
.progress{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.step-dot{width:8px;height:8px;border-radius:50%;background:#21262d;transition:background .3s}
.step-dot.done{background:#238636}
.step-dot.active{background:#1f6feb;box-shadow:0 0 6px #1f6feb}
.phone{width:360px;background:#17212b;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1.5px solid #2d3748}
.phone-bar{background:#232e3c;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2d3748}
.phone-bar .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2a6e9e,#1a4a6e);display:flex;align-items:center;justify-content:center;font-size:16px}
.phone-bar .info .name{font-size:14px;font-weight:600;color:#fff}
.phone-bar .info .status{font-size:11px;color:#7ca0c7}
.phone-chat{padding:12px;min-height:420px;display:flex;flex-direction:column;gap:8px;background:#17212b}
.msg{max-width:85%;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5;position:relative}
.msg.bot{background:#182533;border:1px solid #1e3248;align-self:flex-start;border-bottom-left-radius:2px}
.msg.user{background:#2b5278;align-self:flex-end;border-bottom-right-radius:2px}
.msg .time{font-size:10px;color:#5f7d96;margin-top:4px;text-align:right}
.kbd-grid{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.kbd-row{display:flex;gap:4px}
.kbd-btn{flex:1;padding:6px 8px;background:#182d3e;border:1px solid #1e3a52;border-radius:6px;color:#5bb8f5;font-size:11px;text-align:center;cursor:pointer;transition:background .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd-btn:hover{background:#1e3a52}
.kbd-btn.selected{background:#1f6feb;border-color:#388bfd;color:#fff}
.kbd-btn.back{color:#7d8590;background:#161b22;border-color:#21262d}
.kbd-btn.cancel{color:#f85149;background:#1c0d0d;border-color:#3d1a1a}
.kbd-btn.approve{color:#3fb950;background:#0d1f0d;border-color:#1a3a1a}
.kbd-btn.reject{color:#f85149;background:#1c0d0d;border-color:#3d1a1a}
.info-panel{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:16px;margin-top:20px;font-size:12px;color:#8b949e;line-height:1.7;width:360px}
.info-panel .label{color:#3fb950;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-right:4px}
.tag.fsm{background:#3d1f6b;color:#c084fc}
.tag.cb{background:#0d1f0d;color:#3fb950}
.nav-btns{display:flex;gap:10px;margin-top:16px;width:360px}
.nav-btn{flex:1;padding:9px;border-radius:8px;border:1px solid #21262d;background:#161b22;color:#8b949e;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.nav-btn:hover:not(:disabled){border-color:#388bfd;color:#e6edf3}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.nav-btn.primary:hover{background:#388bfd}
.hint{background:#0d1f0d;border-radius:6px;padding:8px;font-size:11px;margin-top:10px}
.hint-title{color:#3fb950;font-weight:600;margin-bottom:4px}
code{background:#1e2d3d;padding:0 4px;border-radius:3px;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div style="text-align:center;margin-bottom:24px">
  <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#388bfd;margin-bottom:6px">SELLER BOT</div>
  <div style="font-size:22px;font-weight:700">🧑‍💼 Fullz Upload Flow</div>
  <div style="color:#7d8590;font-size:13px;margin-top:4px">Пошаговый FSM — как выглядит в Telegram</div>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>Шаги флоу</h3>
    <div id="sidebar-btns"></div>
    <div style="margin-top:20px">
      <h3>Ветки</h3>
      <div style="font-size:11px;color:#7d8590;line-height:2">
        <div style="color:#c084fc">👤 Personal</div>
        <div style="padding-left:8px;font-size:10px">Тип → Штат → <b style="color:#c084fc">КС → Возраст → Пол</b> → Отчёт → Кол-во → Описание → Цена → Файл</div>
        <div style="color:#58a6ff;margin-top:8px">🏢 Business</div>
        <div style="padding-left:8px;font-size:10px">Тип → Штат → <b style="color:#58a6ff">Компания → Займ → КС</b> → Отчёт → Кол-во → Описание → Цена → Файл</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="progress" id="progress"></div>
    <div style="display:flex;gap:20px;align-items:flex-start">
      <div>
        <div class="phone">
          <div class="phone-bar">
            <div class="avatar">🤖</div>
            <div class="info">
              <div class="name">Seller Bot</div>
              <div class="status">online</div>
            </div>
          </div>
          <div class="phone-chat" id="chat"></div>
        </div>
        <div class="nav-btns">
          <button class="nav-btn" id="btn-prev" onclick="prev()">◀ Назад</button>
          <button class="nav-btn primary" id="btn-next" onclick="next()">Следующий шаг ▶</button>
        </div>
      </div>
      <div class="info-panel" id="info-panel"></div>
    </div>
  </div>
</div>

<script>
const STEPS = [
  {
    title: 'Главное меню',
    fsm: null, cb: 'seller_menu',
    info: 'Продавец нажимает «➕ Добавить Fullz» в главном меню seller_bot.',
    chat: [
      {from:'bot', text:'🏦 <b>Панель продавца</b>\n\n👤 Иван\n📦 Заказы: 12\n💰 Заработано: $340.00', kb:[
        [{t:'🏦 Мои банки'},{t:'💳 Мои CC'}],
        [{t:'📄 Мои документы'},{t:'🧑‍💼 Мои Fullz'}],
        [{t:'➕ Добавить Fullz',sel:true}],
        [{t:'💸 Вывод'},{t:'👤 Профиль'}]
      ]}
    ]
  },
  {
    title: 'Выбор типа',
    fsm: 'waiting_fullz_type', cb: 'seller_add_fullz',
    info: 'Хэндлер add_fullz_start проверяет депозит и can_upload(). FSM переходит в waiting_fullz_type.',
    chat: [
      {from:'user', text:'➕ Добавить Fullz'},
      {from:'bot', text:'🧑‍💼 <b>Добавить набор Fullz</b>\n\nВыберите тип fullz:', kb:[
        [{t:'👤 Персональный',sel:true}],
        [{t:'🏢 Бизнес'}],
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ],
    hint: {title:'✅ Проверки перед стартом', lines:['seller.can_upload()','SellerDepositService.has_upload_access(..., "bank")']}
  },
  {
    title: 'Штат',
    fsm: 'waiting_state', cb: 'seller_fullz_ftype:personal',
    info: 'Продавец выбрал Personal. FSM → waiting_state. Текстовый ввод: CA, NY, TX... или «-» для ANY.',
    chat: [
      {from:'user', text:'👤 Персональный'},
      {from:'bot', text:'Введите штат США (напр. <code>CA</code>) или <code>-</code> для любого:', kb:[
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ]
  },
  {
    title: 'Кредитный рейтинг',
    fsm: 'waiting_credit_score', cb: 'text:CA',
    info: 'Продавец ввёл «CA». Personal-ветка → waiting_credit_score.',
    chat: [
      {from:'user', text:'CA'},
      {from:'bot', text:'Выберите фильтр по кредитному рейтингу:', kb:[
        [{t:'⭐ 800+',sel:true}],
        [{t:'✨ 700+'}],
        [{t:'💠 500+'}],
        [{t:'🔘 Любой КС — $0'}],
        [{t:'⬅️ Назад',cls:'back'}]
      ]}
    ]
  },
  {
    title: 'Возрастной диапазон',
    fsm: 'waiting_age_range', cb: 'seller_fullz_cs:800+',
    info: 'CS выбран (800+). Следующий шаг для Personal → waiting_age_range.',
    chat: [
      {from:'user', text:'⭐ 800+'},
      {from:'bot', text:'Выберите возрастной диапазон:', kb:[
        [{t:'🧒 18–25'},{t:'👨 26–35'}],
        [{t:'🧓 36+',sel:true},{t:'🎲 Любой возраст — $0'}],
        [{t:'⬅️ Назад',cls:'back'}]
      ]}
    ]
  },
  {
    title: 'Пол',
    fsm: 'waiting_gender', cb: 'seller_fullz_age:36+',
    info: 'Возраст выбран. waiting_gender — выбор пола.',
    chat: [
      {from:'user', text:'🧓 36+'},
      {from:'bot', text:'Выберите фильтр по полу:', kb:[
        [{t:'👨 Мужской'},{t:'👩 Женский'}],
        [{t:'🎲 Любой пол — $0',sel:true}],
        [{t:'⬅️ Назад',cls:'back'}]
      ]}
    ]
  },
  {
    title: 'Тип отчёта',
    fsm: 'waiting_report_group', cb: 'seller_fullz_gender:any',
    info: 'Personal и Business соединяются здесь — waiting_report_group.',
    chat: [
      {from:'user', text:'🎲 Любой пол — $0'},
      {from:'bot', text:'Выберите тип отчёта, включённого в набор:', kb:[
        [{t:'💼 Базовый'}],
        [{t:'📘 С CR'}],
        [{t:'🪪 CR и DL',sel:true}],
        [{t:'🛰️ CR, DL и MVR'}],
        [{t:'🏁 CR, DL и FULL MVR'}],
        [{t:'⬅️ Назад',cls:'back'}]
      ]}
    ]
  },
  {
    title: 'Количество',
    fsm: 'waiting_quantity', cb: 'seller_fullz_report:cr_dl',
    info: 'Тип отчёта выбран. waiting_quantity — сколько наборов в пакете. Текстовый ввод числа.',
    chat: [
      {from:'user', text:'🪪 CR и DL'},
      {from:'bot', text:'Сколько полных наборов fullz входит в этот пакет?\n(Введите число, напр. <code>1</code>, <code>5</code>)', kb:[
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ]
  },
  {
    title: 'Описание',
    fsm: 'waiting_description', cb: 'text:5',
    info: 'Кол-во введено (5). waiting_description. Можно отправить «-» для пропуска.',
    chat: [
      {from:'user', text:'5'},
      {from:'bot', text:'Введите краткое описание (или отправьте <code>-</code> для пропуска):', kb:[
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ]
  },
  {
    title: 'Цена',
    fsm: 'waiting_price', cb: 'text:Fresh CA 800+ 36+ x5',
    info: 'Описание введено. waiting_price — базовая цена продавца в USD.',
    chat: [
      {from:'user', text:'Fresh CA 800+ 36+ x5'},
      {from:'bot', text:'Введите вашу базовую цену в USD (напр. <code>150</code>):', kb:[
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ]
  },
  {
    title: 'Загрузка файла',
    fsm: 'waiting_data_file', cb: 'text:250',
    info: 'Цена $250 принята. Последний шаг — загрузка .txt / .csv / .zip файла с данными.',
    chat: [
      {from:'user', text:'250'},
      {from:'bot', text:'Загрузите файл с данными fullz (.txt, .csv, .zip).\nФайл хранится в защищённом виде и используется для исполнения заказов.', kb:[
        [{t:'❌ Отмена',cls:'cancel'}]
      ]}
    ]
  },
  {
    title: '✅ Готово',
    fsm: null, cb: 'file:data_ca.csv',
    info: 'Файл получен. Создаётся SellerUploadBatch + SellerFullzItem. FSM очищается.',
    chat: [
      {from:'user', text:'📎 data_ca_800plus.csv'},
      {from:'bot', text:'✅ Набор fullz отправлен на модерацию.\n\n🧑‍💼 Товар: Personal Fullz | CS:800+ | 36+ | any | CA | x5\n📋 Партия: #42'}
    ],
    hint: {title:'📦 Что создаётся в БД:', lines:['SellerUploadBatch (id=42, item_type=fullz)','SellerFullzItem (moderation_status=pending_moderation)','NocoDBService.log_seller_upload(category="fullz")']}
  },
  {
    title: 'Модерация (support_bot)',
    fsm: null, cb: '/seller_moderation',
    info: 'Администратор открывает /seller_moderation в support_bot. Видит счётчик Fullz pending: 1.',
    chat: [
      {from:'bot', text:'📋 <b>Seller Product Moderation</b>\n\n🏦 Banks pending: 3\n💳 CC items pending: 1\n📄 Documents pending: 0\n🧑‍💼 <b>Fullz pending: 1</b>\n\nSelect to moderate:', kb:[
        [{t:'🧑‍💼 Fullz (1)',sel:true,cls:'approve'}],
        [{t:'🏦 Banks (3)'}],
        [{t:'🔄 Refresh'}]
      ]}
    ]
  },
  {
    title: 'Карточка модерации',
    fsm: null, cb: 'mod_fullz_list → mod_fullz:1',
    info: 'Детальная карточка товара. Кнопки: Одобрить / Отклонить / Запросить изменения.',
    chat: [
      {from:'bot', text:'🧑‍💼 <b>Fullz #1</b>\n\nТип: Персональный\nШтат: CA\nКС: 800+\nВозраст: 36+\nПол: any\nОтчёт: cr_dl\nКол-во: 5\nПартия: #42\nЦена продавца: $250\nЦена покупателя: $300\nСтатус: pending_moderation', kb:[
        [{t:'✅ Одобрить',cls:'approve'},{t:'❌ Отклонить',cls:'reject'}],
        [{t:'📝 Запросить изменения'}],
        [{t:'⬅️ Назад',cls:'back'}]
      ]}
    ],
    hint: {title:'💰 При одобрении:', lines:['apply_fullz_markup() → +20% (Personal)','buyer_price: $250 → $300','moderation_status = approved','SellerUploadBatchService.recalc_batch_status()']}
  }
];

let cur = 0;

function renderSidebar(){
  document.getElementById('sidebar-btns').innerHTML = STEPS.map((s,i) => `
    <button class="flow-btn ${i===cur?'active':''}" onclick="goto(${i})">
      <span class="num">${i+1}</span>${s.title}
    </button>`).join('');
}

function renderProgress(){
  document.getElementById('progress').innerHTML = STEPS.map((_,i) => `
    <div class="step-dot ${i<cur?'done':i===cur?'active':''}"></div>`).join('');
}

function renderMsg(m){
  const cls = m.from==='bot'?'bot':'user';
  const text = m.text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
    .replace(/&lt;code&gt;/g,'<code>').replace(/&lt;\/code&gt;/g,'</code>')
    .replace(/\n/g,'<br>');
  let kbHtml = '';
  if(m.kb){
    kbHtml = '<div class="kbd-grid">';
    for(const row of m.kb){
      kbHtml += '<div class="kbd-row">';
      for(const btn of row){
        const extra = btn.sel?'selected':(btn.cls||'');
        kbHtml += `<div class="kbd-btn ${extra}">${btn.t}</div>`;
      }
      kbHtml += '</div>';
    }
    kbHtml += '</div>';
  }
  return `<div class="msg ${cls}">${text}${kbHtml}<div class="time">${m.from==='bot'?'🤖 Bot':'👤 You'} · now</div></div>`;
}

function renderChat(){
  document.getElementById('chat').innerHTML = STEPS[cur].chat.map(renderMsg).join('');
}

function renderInfo(){
  const s = STEPS[cur];
  let html = `<div class="label">Техническая информация</div>`;
  if(s.fsm) html += `<div><span class="tag fsm">FSM State</span> <code style="color:#c084fc">${s.fsm}</code></div>`;
  if(s.cb)  html += `<div style="margin-top:4px"><span class="tag cb">callback / trigger</span> <code style="color:#3fb950">${s.cb}</code></div>`;
  html += `<div style="margin-top:10px">${s.info}</div>`;
  if(s.hint){
    html += `<div class="hint"><div class="hint-title">${s.hint.title}</div>`;
    html += s.hint.lines.map(l=>`<div>• <code style="color:#8b949e">${l}</code></div>`).join('');
    html += '</div>';
  }
  document.getElementById('info-panel').innerHTML = html;
}

function goto(i){ cur = Math.max(0,Math.min(STEPS.length-1,i)); renderAll(); }
function next(){ goto(cur+1); }
function prev(){ goto(cur-1); }

function renderAll(){
  renderSidebar(); renderProgress(); renderChat(); renderInfo();
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===STEPS.length-1;
  document.getElementById('btn-next').textContent = cur<STEPS.length-1 ? 'Следующий шаг ▶' : '✅ Конец флоу';
}

renderAll();
</script>
</body>
</html>
