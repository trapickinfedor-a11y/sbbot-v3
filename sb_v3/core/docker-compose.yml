version: "3.9"
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_QUEUE_ENABLED=${API_QUEUE_ENABLED:-0}
    volumes: [./data:/app/data, ./logs:/app/logs]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: python bot.py
    networks: [sbbot]

  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - API_QUEUE_ENABLED=${API_QUEUE_ENABLED:-1}
    volumes: [./data:/app/data]
    expose: ["8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 3
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 4
    networks: [sbbot]

  celery_worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes: [./data:/app/data]
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_worker worker --loglevel=INFO --concurrency 20 --prefetch-multiplier 4
    deploy:
      replicas: 2
    networks: [sbbot]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: [redis_data:/data]
    networks: [sbbot]

volumes:
  redis_data:

networks:
  sbbot:
    driver: bridge