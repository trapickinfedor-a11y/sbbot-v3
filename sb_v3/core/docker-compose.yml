version: "3.9"

services:
  # ── Telegram bot ──────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - EMAILREP_KEY=${EMAILREP_KEY:-}
      - BATCH_SIZE=${BATCH_SIZE:-5}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbbot

  # ── FastAPI web server ───────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    command: python3 -m uvicorn server.index:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sbbot

  # ── Celery worker ────────────────────────────────────────────────────
  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker worker --loglevel=INFO --concurrency=4
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sbbot

  # ── Celery beat (scheduler) ──────────────────────────────────────────
  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sbbot

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sbbot

networks:
  sbbot:
    driver: bridge

volumes:
  redis_data:
